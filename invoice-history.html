<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invoice History - Naija Invoice Maker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .history-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .history-header h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    .history-header p {
      margin: 0;
      color: #667085;
    }

    .history-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .history-btn {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .history-btn-primary {
      background: #008f5a;
      color: white;
    }

    .history-btn-primary:hover {
      background: #007a4d;
    }

    .history-btn-outline {
      background: white;
      color: #17221b;
      border: 1px solid #d0d5dd;
    }

    .history-btn-outline:hover {
      background: #f9fafb;
    }

    .history-card {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 15px;
      margin-bottom: 25px;
    }

    .search-input,
    .status-filter {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .search-input:focus,
    .status-filter:focus {
      outline: none;
      border-color: #008f5a;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .invoice-history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .invoice-history-table th {
      text-align: left;
      padding: 14px 10px;
      color: #667085;
      font-size: 13px;
      border-bottom: 1px solid #eaecf0;
      white-space: nowrap;
    }

    .invoice-history-table td {
      padding: 16px 10px;
      border-bottom: 1px solid #f2f4f7;
      font-size: 14px;
    }

    .invoice-number {
      font-weight: 600;
      color: #17221b;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-paid {
      background: #dcfae6;
      color: #067647;
    }

    .status-unpaid {
      background: #fff4cc;
      color: #a15c00;
    }

    .status-overdue {
      background: #fee4e2;
      color: #b42318;
    }

    .status-draft {
      background: #f2f4f7;
      color: #344054;
    }

    .status-default {
      background: #f2f4f7;
      color: #344054;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: 1px solid #d0d5dd;
      background: white;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .small-btn:hover {
      background: #f9fafb;
    }

    .delete-btn {
      color: #b42318;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667085;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #667085;
    }

    .empty-state h3 {
      color: #17221b;
      margin-bottom: 8px;
    }

    .error-message {
      background: #fee4e2;
      color: #b42318;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .results-info {
      color: #667085;
      font-size: 13px;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {

      .history-container {
        padding: 25px 15px;
      }

      .history-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .history-actions {
        width: 100%;
      }

      .history-btn {
        flex: 1;
      }

      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>


<body>

  <!-- APP TOP HEADER -->

<header class="app-header">

  <button
    type="button"
    class="sidebar-menu-button"
    onclick="toggleSidebar()"
    aria-label="Open menu">
    ☰
  </button>

  <span class="app-header-logo">
    ₦
  </span>

  <span class="app-header-title">
    Naija Invoice Maker
  </span>

</header>


<!-- SIDEBAR -->

<aside
  id="sidebar"
  class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      ₦ Naija Invoice Maker
    </div>

    <button
      type="button"
      class="sidebar-close"
      onclick="closeSidebar()"
      aria-label="Close menu">
      ×
    </button>

  </div>


  <nav class="sidebar-menu">

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='dashboard.html'">
      🏠 Dashboard
    </button>

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='index.html'">
      🧾 Create Invoice
    </button>

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='invoice-history.html'">
      📋 Invoice History
    </button>

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='customers.html'">
      👥 Customers
    </button>

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='business.html'">
      🏢 Business
    </button>

    <button
      type="button"
      class="sidebar-link"
      onclick="window.location.href='settings.html'">
      ⚙️ Settings
    </button>

    <button
       type="button"
       class="sidebar-link"
       onclick="window.location.href='subscription.html'">
       💳 Subscription
    </button>

    <div class="sidebar-divider"></div>

    <button
      type="button"
      id="sidebarLogoutBtn"
      class="sidebar-link">
      🚪 Logout
    </button>

  </nav>

</aside>


<!-- SIDEBAR OVERLAY -->

<div
  id="sidebarOverlay"
  class="sidebar-overlay"
  onclick="closeSidebar()">
</div>

  <!-- MAIN -->

  <main class="history-container">

    <div class="history-header">

      <div>

        <h1>Invoice History</h1>

        <p>
          View and manage all your saved invoices.
        </p>

      </div>

    </div>


    <!-- ERROR -->

    <div
      id="errorMessage"
      class="error-message">
    </div>


    <section class="history-card">

      <!-- SEARCH + FILTER -->

      <div class="filters">

        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search invoice number or customer...">

        <select
          id="statusFilter"
          class="status-filter">

          <option value="all">
            All Statuses
          </option>

          <option value="Draft">
            Draft
          </option>

          <option value="Unpaid">
            Unpaid
          </option>

          <option value="Paid">
            Paid
          </option>

          <option value="Overdue">
            Overdue
          </option>

        </select>

      </div>


      <div
        id="resultsInfo"
        class="results-info">
        Loading invoices...
      </div>


      <!-- LOADING -->

      <div
        id="loading"
        class="loading">

        Loading invoices...

      </div>


      <!-- EMPTY -->

      <div
        id="emptyState"
        class="empty-state"
        style="display:none;">

        <h3>
          No invoices found
        </h3>

        <p>
          Your saved invoices will appear here.
        </p>

        <br>

        <button
          type="button"
          class="history-btn history-btn-primary"
          onclick="goToCreateInvoice()">

          Create Invoice

        </button>

      </div>


      <!-- TABLE -->

      <div
        id="tableContainer"
        class="table-wrapper"
        style="display:none;">

        <table class="invoice-history-table">

          <thead>

            <tr>

              <th>
                Invoice
              </th>

              <th>
                Customer
              </th>

              <th>
                Date
              </th>

              <th>
                Amount
              </th>

              <th>
                Status
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>

          <tbody id="invoiceTableBody">
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-confige.js"></script>

  <script src="navigation.js"></script>

  <script src="invoice-history.js"></script>

</body>

</html>
