<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account - Naija Invoice Maker</title>

  <link rel="stylesheet" href="auth.css">

</head>

<body>

  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-logo">
        <span>₦</span>
        Naija Invoice Maker
      </div>

      <h1>Create your account</h1>

      <p class="auth-subtitle">
        Start creating professional invoices for your business.
      </p>


      <form id="signupForm">

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            placeholder="e.g. Muhammad Abba"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter your password again"
            minlength="6"
            required
          >

        </div>


        <div
          id="message"
          class="message"
        ></div>


        <button
          type="submit"
          class="auth-button"
          id="signupButton"
        >
          Create Account
        </button>

      </form>


      <p class="auth-footer">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-confige.js"></script>

  <script src="auth.js"></script>


</body>

</html>
