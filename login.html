<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Naija Invoice Maker</title>

  <link rel="stylesheet" href="auth.css">

</head>

<body>

  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-logo">
        <span>₦</span>
        Naija Invoice Maker
      </div>

      <h1>Welcome back</h1>

      <p class="auth-subtitle">
        Login to manage your invoices.
      </p>


      <form id="loginForm">

        <div class="form-group">

          <label for="loginEmail">
            Email Address
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Your password"
            required
          >

        </div>


        <div class="forgot-password">

          <a href="#" id="forgotPassword">
            Forgot password?
          </a>

        </div>


        <div
          id="loginMessage"
          class="message"
        ></div>


        <button
          type="submit"
          class="auth-button"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <p class="auth-footer">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-confige.js"></script>

  <script src="auth.js"></script>

</body>

</html>
